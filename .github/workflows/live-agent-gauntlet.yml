name: Live Agent Gauntlet

# On-demand ONLY. These are real-inference tests: they install four coding-agent
# CLIs and run live turns against Nebius, so they need the NEBIUS_API_KEY repo
# secret and consume API credits. Run them from the Actions tab (or `gh workflow
# run "Live Agent Gauntlet"`) when you want a full live verification. Every-push
# checks live in ci.yml (offline, free).
on:
  workflow_dispatch:
    inputs:
      harness:
        description: "Harness test file to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - claude
          - codex
          - live-models-check
          - opencode
          - pi
  # Push-to-run escape hatch: pushing this branch runs the full gauntlet
  # (harness defaults to "all" for non-dispatch events). Exists because the
  # repo's GitHub App integration cannot call the workflow-dispatch API
  # (403, no actions:write), but it can push. Re-run by pushing an empty
  # commit to the branch; keep the branch pointed at the code you want tested.
  push:
    branches:
      - trigger/live-gauntlet

concurrency:
  group: live-agent-gauntlet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live:
    name: Real inference harness tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The NEBIUS_API_KEY / TAVILY_API_KEY secrets are scoped to the
    # "production" environment (not repository-level), so the job must declare
    # that environment for `secrets.*` to resolve them.
    environment: production
    env:
      CI: "true"
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      # Optional: enables the web-search legs (Tavily-backed web_search
      # emulation + the Tavily MCP auto-inject). Without it those tests see
      # the documented "TAVILY_API_KEY not set" path instead of live search.
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      KIMIRELAY_DEBUG: "1"
      VITEST_RETRY: "3"
      HARNESS: ${{ github.event.inputs.harness || 'all' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.9.0"

      - name: Verify Nebius secret
        run: |
          if [ -z "$NEBIUS_API_KEY" ]; then
            echo "NEBIUS_API_KEY repository secret is required for live inference tests." >&2
            exit 1
          fi

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false

      # Speeds up the `build` tasks only. The test:gauntlet:* tasks are
      # "cache": false in turbo.json - live tests validate an external system
      # (Nebius + the installed agent CLIs), so a cached PASS proves nothing
      # about the current key or backend and must never be replayed.
      - name: Restore Turborepo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Verify TypeScript native compiler
        run: node_modules/.bin/tsc --version

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Install coding-agent CLIs
        run: |
          case "$HARNESS" in
            all)
              # OpenCode's official npm package is `opencode-ai`; it installs the
              # `opencode` binary. See https://github.com/anomalyco/opencode.
              npm install -g @anthropic-ai/claude-code @openai/codex opencode-ai@latest @earendil-works/pi-coding-agent
              claude --version
              codex --version
              opencode --version
              pi --version
              ;;
            live-models-check)
              npm install -g @anthropic-ai/claude-code @openai/codex
              claude --version
              codex --version
              ;;
            claude)
              npm install -g @anthropic-ai/claude-code
              claude --version
              ;;
            codex)
              npm install -g @openai/codex
              codex --version
              ;;
            opencode)
              # OpenCode's official npm package is `opencode-ai`; it installs the
              # `opencode` binary. See https://github.com/anomalyco/opencode.
              npm install -g opencode-ai@latest
              opencode --version
              ;;
            pi)
              npm install -g @earendil-works/pi-coding-agent
              pi --version
              ;;
            *)
              echo "Unknown harness: $HARNESS" >&2
              exit 1
              ;;
          esac

      - name: Build kimirelay CLI
        run: pnpm exec turbo run build --filter @kimirelay/models --filter @kimirelay/cli

      - name: Typecheck live tests
        run: node_modules/.bin/tsc -p packages/tests/tsconfig.json --noEmit

      - name: Run live agent gauntlet
        run: |
          case "$HARNESS" in
            all)
              VITEST_FILE_PARALLELISM=0 VITEST_MAX_CONCURRENCY=1 pnpm exec turbo run test:gauntlet:core test:gauntlet:claude test:gauntlet:codex test:gauntlet:opencode test:gauntlet:pi --filter @kimirelay/tests --concurrency=1 --continue
              ;;
            claude)
              pnpm exec turbo run test:gauntlet:claude --filter @kimirelay/tests
              ;;
            codex)
              pnpm exec turbo run test:gauntlet:codex --filter @kimirelay/tests
              ;;
            live-models-check)
              pnpm exec turbo run test:gauntlet:live-models-check --filter @kimirelay/tests
              ;;
            opencode)
              pnpm exec turbo run test:gauntlet:opencode --filter @kimirelay/tests
              ;;
            pi)
              pnpm exec turbo run test:gauntlet:pi --filter @kimirelay/tests
              ;;
            *)
              echo "Unknown harness: $HARNESS" >&2
              exit 1
              ;;
          esac

      - name: Stop kimirelay daemon
        if: always()
        run: node packages/cli/dist/bin/kimirelay.js daemon stop || true

      - name: Save Turborepo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload live test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-agent-gauntlet-artifacts
          path: packages/tests/artifacts/
          if-no-files-found: ignore
          retention-days: 14
